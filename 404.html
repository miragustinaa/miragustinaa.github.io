<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>404 - Halaman Tidak Ditemukan | Mira MC</title>
    
    <!-- Favicon -->
    <link rel="icon" href="favicon.png" type="image/png" sizes="512x512">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f1015;
            --gold: #d4af37;
            --text-main: #f8f9fa;
            --text-muted: #a0a0a0;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a24 100%); 
            color: var(--text-main); 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Animasi */
        .fade-up { animation: fadeInUp 0.8s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: var(--gold);
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .error-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .error-desc {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 12px 35px;
            border-radius: 30px;
            text-decoration: none !important;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-home:hover {
            background: var(--gold);
            color: var(--bg-dark);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        @media (max-width: 768px) {
            .error-code { font-size: 6rem; }
            .error-title { font-size: 1.5rem; }
            .error-desc { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="fade-up">
        <div class="error-code">404</div>
        <div class="error-title">Oops! Panggung Kosong...</div>
        <p class="error-desc">
            Sepertinya halaman yang Anda cari tidak ada di dalam <i>rundown</i> acara kami, atau mungkin sudah dipindahkan.
        </p>
        
        <!-- Tombol kembali ke halaman utama -->
        <a href="/" class="btn-home">
            <i class="fas fa-home"></i> Kembali ke Beranda
        </a>
    </div>

</body>
</html>
